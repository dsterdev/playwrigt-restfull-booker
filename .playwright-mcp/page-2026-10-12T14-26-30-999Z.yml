- generic [active] [ref=f2e1]: "# Plan de pruebas - Restful Booker Platform ## Application Overview Plan funcional integral para https://automationintesting.online/ (Restful-booker-platform demo v2.2). Incluye recorridos públicos de navegación, disponibilidad, detalle y reserva de habitaciones, formulario de contacto, acceso administrativo y gestión de habitaciones, reporte, mensajes, marca, cierre de sesión y páginas legales. Credenciales de demostración válidas para las pruebas autenticadas: usuario admin, contraseña password. Ejecutar cada caso de forma independiente en un entorno de pruebas; partir de un estado sin datos creados por ejecuciones previas, conservar los datos preexistentes y limpiar únicamente los registros generados por el caso. Cuando se prueben modificaciones de marca, restaurar los valores originales al finalizar. ## Test Scenarios ### 1. Sitio público y navegación **Seed:** `` #### 1.1. Verificar página de inicio y navegación pública **File:** `specs\\public-site\\landing-navigation.spec.ts` **Steps:** 1. Partiendo de un navegador sin sesión iniciada, abrir https://automationintesting.online/. - expect: Se muestra el título Restful-booker-platform demo y la cabecera Welcome to Shady Meadows B&B. 2. Revisar la navegación superior, las secciones Rooms, Booking, Amenities, Location y Contact, los enlaces Book Now y Admin, las tarjetas de habitaciones y el pie de página. - expect: Los enlaces de navegación conducen a la sección indicada sin errores. - expect: Se muestran las habitaciones Single, Double y Suite con amenidades, precio y opción Book now. - expect: El pie de página ofrece los enlaces Cookie-Policy, Privacy-Policy y Admin panel. 3. Usar Book Now y los enlaces de ancla del menú; luego volver al inicio mediante el nombre del alojamiento. - expect: Book Now desplaza a la sección de disponibilidad y los enlaces de sección actualizan la navegación a sus destinos. - expect: El enlace de marca vuelve a la portada. #### 1.2. Verificar páginas de cookies y privacidad **File:** `specs\\public-site\\legal-pages.spec.ts` **Steps:** 1. Desde el pie de página de la portada, abrir Cookie-Policy. - expect: Se presenta el encabezado Cookie Policy y el contenido es legible, incluidos los apartados sobre cookies, categorías de uso y enlaces a terceros. 2. Volver al sitio y abrir Privacy-Policy. - expect: Se presenta el encabezado Privacy Policy Notice y se muestra el contenido de la política sin errores de carga. 3. Usar los enlaces del pie para alternar entre políticas y regresar a la portada. - expect: Ambos enlaces legales funcionan y permiten volver a la navegación pública. #### 1.3. Enviar consulta válida desde el formulario de contacto **File:** `specs\\public-site\\contact-form.spec.ts` **Steps:** 1. En estado limpio, abrir la sección Send Us a Message e introducir nombre, email válido, teléfono, asunto y mensaje de prueba únicos. - expect: Los cinco campos aceptan sus valores y no alteran el contenido de otras secciones. 2. Enviar el formulario con Submit. - expect: Se informa claramente el éxito del envío y la consulta se registra una sola vez. - expect: La consulta queda disponible en la bandeja administrativa de mensajes para su verificación y limpieza. 3. Eliminar únicamente la consulta de prueba desde el panel administrativo, si la aplicación permite eliminar mensajes. - expect: La consulta de prueba deja de aparecer y los mensajes preexistentes permanecen intactos. #### 1.4. Validar campos requeridos y formato en contacto **File:** `specs\\public-site\\contact-validation.spec.ts` **Steps:** 1. Abrir el formulario de contacto y pulsar Submit dejando todos los campos vacíos. - expect: No se crea ningún mensaje y el formulario señala los campos obligatorios o muestra validaciones comprensibles. 2. Probar por separado un email mal formado y valores límite/vacíos en nombre, teléfono, asunto y mensaje; enviar cada combinación. - expect: El email inválido se rechaza y los campos requeridos no permiten un envío incompleto. - expect: Los errores se muestran cerca del formulario y no se registra ninguna consulta inválida. 3. Corregir todos los datos con valores válidos y enviar. - expect: La validación desaparece y se permite el envío válido. ### 2. Disponibilidad y reservas **Seed:** `` #### 2.1. Consultar disponibilidad para fechas válidas **File:** `specs\\booking\\availability-search.spec.ts` **Steps:** 1. Abrir la portada y localizar Check Availability & Book Your Stay; anotar las fechas iniciales antes de cambiarlas. - expect: Se muestran los campos Check In y Check Out y el botón Check Availability. 2. Introducir una fecha de entrada futura y una salida posterior, en formato admitido, y consultar disponibilidad. - expect: Las fechas se aceptan y los resultados reflejan la estancia seleccionada. - expect: Las habitaciones disponibles muestran su tipo, precio y enlace Book now; los enlaces de reserva conservan las fechas consultadas. 3. Repetir la búsqueda con un rango válido distinto. - expect: La lista de resultados se actualiza según el nuevo rango sin duplicar habitaciones ni conservar resultados obsoletos. #### 2.2. Rechazar rangos de fechas inválidos **File:** `specs\\booking\\availability-date-validation.spec.ts` **Steps:** 1. En el buscador de disponibilidad, probar fechas vacías, formato inválido, salida anterior a la entrada y entrada/salida el mismo día. - expect: Cada rango inválido es rechazado o señalado claramente; no se presentan resultados como si la consulta fuera válida. 2. Probar fechas pasadas y una estancia límite razonable. - expect: Las fechas pasadas se rechazan cuando no son reservables; el límite permitido se maneja de forma consistente y sin errores técnicos visibles. 3. Restablecer un rango futuro válido y consultar disponibilidad. - expect: El buscador se recupera y muestra resultados válidos después de corregir los datos. #### 2.3. Verificar detalle de habitación, calendario y cálculo del precio **File:** `specs\\booking\\room-details.spec.ts` **Steps:** 1. Abrir desde la portada el detalle de una habitación mediante Book now o View Details. - expect: Se muestran tipo, imagen, descripción, accesibilidad, características, políticas y precio por noche de la habitación correcta. 2. Revisar el calendario de disponibilidad y utilizar Today, Back y Next cuando estén disponibles. - expect: El calendario presenta los días de la semana y el mes correcto, y los controles cambian el mes sin perder consistencia. 3. Seleccionar una estancia de una noche y después una de varias noches. - expect: El resumen calcula precio por noche multiplicado por noches, añade las tarifas de limpieza/servicio mostradas y presenta un total aritméticamente correcto. 4. Intentar seleccionar fechas ocupadas o un rango con salida anterior a la entrada. - expect: Las fechas no disponibles o inválidas no permiten seguir con una reserva incoherente. #### 2.4. Completar una reserva válida y verificar confirmación **File:** `specs\\booking\\reservation-happy-path.spec.ts` **Steps:** 1. Partiendo de una habitación reservable y un rango futuro disponible, abrir su detalle e introducir fechas de entrada y salida. - expect: Se seleccionan fechas válidas y el resumen de precio coincide con la cantidad de noches y tarifas informadas. 2. Pulsar Reserve Now para abrir el formulario y completar Firstname, Lastname, Email y Phone con datos sintéticos válidos. - expect: El formulario muestra los campos del titular y conserva habitación, fechas y precio elegidos. 3. Confirmar la reserva. - expect: La reserva se crea una sola vez y la interfaz presenta confirmación con habitación, estancia, titular y total correctos. 4. Verificar la reserva en el panel administrativo o calendario de reporte y eliminar únicamente el registro creado para esta prueba. - expect: El registro administrativo coincide con la confirmación y la limpieza no afecta reservas preexistentes. #### 2.5. Validar datos incompletos y formatos inválidos de reserva **File:** `specs\\booking\\reservation-validation.spec.ts` **Steps:** 1. Abrir el formulario Reserve Now y tratar de continuar dejando los datos del titular vacíos. - expect: La reserva no se crea y se señalan los campos obligatorios. 2. Probar email mal formado, teléfono vacío o inválido, nombres vacíos y cadenas en los límites de longitud. - expect: Los formatos inválidos o campos obligatorios se rechazan sin crear una reserva ni mostrar una confirmación engañosa. 3. Corregir los datos y completar el flujo; luego cancelar o eliminar únicamente la reserva de prueba. - expect: Los errores desaparecen con datos válidos, la reserva puede completarse y el estado final queda limpio. 4. Abrir una reserva y usar Cancel antes de confirmar. - expect: El formulario se cierra o vuelve al estado anterior sin crear una reserva. ### 3. Panel administrativo **Seed:** `` #### 3.1. Validar acceso administrativo y rechazo de credenciales **File:** `specs\\admin\\authentication.spec.ts` **Steps:** 1. Abrir /admin en un navegador sin sesión. - expect: Se muestra el formulario Login con Username y Password. 2. Enviar el formulario vacío y luego probar usuario o contraseña incorrectos. - expect: No se concede acceso; los errores de autenticación se comunican claramente y no se exponen datos administrativos. 3. Iniciar sesión con usuario admin y contraseña password. - expect: Se autentica correctamente y se abre /admin/rooms con enlaces Rooms, Report, Branding, Messages y Logout. 4. Recargar /admin/rooms y navegar a otra sección administrativa. - expect: La sesión válida se conserva durante la navegación y el contenido administrativo está disponible. #### 3.2. Crear y eliminar habitación de prueba **File:** `specs\\admin\\room-management.spec.ts` **Steps:** 1. Iniciar sesión y abrir Rooms; anotar las habitaciones preexistentes y sus datos. - expect: La tabla muestra Room #, Type, Accessible, Price y Room details, y el formulario ofrece controles de creación. 2. Crear una habitación con número único, tipo, accesibilidad, precio positivo y amenidades seleccionadas. - expect: La habitación aparece una sola vez en la lista con los valores exactos y las amenidades elegidas. 3. Crear otra habitación con campos obligatorios vacíos, número duplicado, precio inválido o fuera de rango. - expect: El sistema rechaza cada entrada inválida y no crea habitaciones parciales ni duplicados. 4. Eliminar solo la habitación creada en el primer paso. - expect: La habitación de prueba desaparece y las habitaciones que existían al inicio siguen intactas. #### 3.3. Navegar el calendario de reportes **File:** `specs\\admin\\report-calendar.spec.ts` **Steps:** 1. Iniciar sesión y abrir Report; anotar el mes visible y cualquier reserva preexistente. - expect: Se presenta el calendario mensual con días de la semana y botones Today, Back y Next. 2. Usar Back, Next y Today. - expect: Cada control cambia al mes esperado y Today vuelve al mes actual. 3. Inspeccionar una reserva visible sin modificarla. - expect: El evento identifica la reserva y la habitación correspondiente; el reporte refleja los datos existentes sin duplicarlos. 4. Abrir el reporte en un mes sin eventos. - expect: El calendario sigue navegable y representa correctamente la ausencia de reservas. #### 3.4. Verificar bandeja de mensajes y ciclo de vida del mensaje **File:** `specs\\admin\\messages-inbox.spec.ts` **Steps:** 1. Con una consulta de contacto de prueba creada por este caso, iniciar sesión y abrir Messages. - expect: La bandeja muestra nombre y asunto del mensaje y el contador representa los mensajes pendientes disponibles. 2. Abrir el mensaje de prueba para revisar el detalle. - expect: Se muestran los datos del mensaje enviados en el formulario y el contenido es legible. 3. Eliminar únicamente el mensaje de prueba. - expect: El mensaje desaparece de la bandeja y el contador se actualiza; mensajes preexistentes no se modifican. #### 3.5. Actualizar y restaurar configuración de marca **File:** `specs\\admin\\branding-settings.spec.ts` **Steps:** 1. Iniciar sesión y abrir Branding; guardar una copia de los valores originales de B&B details, Map details, Contact details y Address details. - expect: Los campos cargan los valores actuales, incluido nombre, logo, descripción, coordenadas, contacto y dirección. 2. Cambiar nombre, descripción y un dato de contacto por valores sintéticos únicos y pulsar Submit. - expect: La interfaz confirma guardado y los cambios persisten al recargar la página. 3. Comprobar en la portada que los campos públicos que dependen de la marca reflejan los cambios guardados. - expect: La presentación pública refleja los nuevos datos sin romper la navegación, el mapa ni el contacto. 4. Restaurar todos los valores originales guardados al inicio y verificar tras recargar. - expect: La configuración original vuelve a mostrarse tanto en Branding como en las superficies públicas; no se deja información temporal. 5. Probar coordenadas y email inválidos sin confirmar cambios persistentes. - expect: Los valores inválidos se rechazan o muestran errores claros y no reemplazan silenciosamente la configuración válida. #### 3.6. Cerrar sesión y proteger rutas administrativas **File:** `specs\\admin\\logout-and-access-control.spec.ts` **Steps:** 1. Iniciar sesión y abrir /admin/rooms. - expect: El panel muestra el botón Logout y las opciones administrativas. 2. Pulsar Logout y volver a abrir /admin/rooms o /admin/report en la misma sesión de navegador. - expect: La sesión termina, el contenido protegido no queda accesible y se solicita iniciar sesión. 3. Usar Atrás del navegador y recargar una página administrativa. - expect: No se revela contenido protegido mediante una página almacenada en caché; se requiere autenticación nuevamente."